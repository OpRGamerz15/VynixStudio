<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vynix Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07070c; --bg2:#0b0b13; --panel:#101019; --panel2:#15151f; --line:#22222f;
  --text:#e9e9f2; --muted:#9a9ab0; --dim:#6d6d85;
  --pri:#8b5cf6; --pri2:#a855f7; --pri-dim:rgba(139,92,246,.14); --pri-line:rgba(139,92,246,.38);
  --ok:#34d399; --warn:#fbbf24; --err:#f87171; --info:#60a5fa;
  --radius:14px; --shadow:0 10px 40px -12px rgba(0,0,0,.7);
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"Outfit",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
:root:not([data-theme="light"]){color-scheme:dark}
@media (prefers-color-scheme: light){
  :root:not([data-theme="light"]){color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 600px at 82% -8%, rgba(139,92,246,.20), transparent 60%),
    radial-gradient(800px 500px at 0% 100%, rgba(168,85,247,.10), transparent 60%),
    var(--bg);
  color:var(--text); font-family:var(--sans); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased; min-height:100vh;
}
img{max-width:100%}
a{color:var(--pri2);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#242433;border-radius:20px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:256px 1fr;min-height:100vh}
.sidebar{
  position:sticky;top:0;height:100vh;overflow-y:auto;
  background:linear-gradient(180deg,rgba(17,17,26,.95),rgba(8,8,13,.95));
  border-right:1px solid var(--line);backdrop-filter:blur(14px);z-index:40;
  display:flex;flex-direction:column;
}
.brand{display:flex;gap:11px;align-items:center;padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,var(--pri),#6d28d9);
  display:grid;place-items:center;font-weight:800;font-size:20px;color:#fff;
  box-shadow:0 6px 18px -6px rgba(139,92,246,.8); flex:0 0 auto}
.brand h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.2px}
.brand h1 span{color:var(--pri2)}
.brand small{display:block;font-size:9.5px;letter-spacing:2px;color:var(--dim);text-transform:uppercase}
.nav{padding:12px 10px;flex:1}
.nav-label{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);padding:14px 10px 6px;font-weight:600}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;color:var(--muted);
  font-size:14.5px;font-weight:500;text-decoration:none;transition:.16s;position:relative}
.nav a:hover{background:#ffffff08;color:var(--text);text-decoration:none}
.nav a.active{background:linear-gradient(90deg,var(--pri-dim),transparent);color:#fff}
.nav a.active::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--pri)}
.nav a .ic{width:18px;height:18px;flex:0 0 auto;opacity:.9}
.nav .badge{margin-left:auto;background:var(--pri);color:#fff;font-size:10.5px;font-weight:700;border-radius:20px;padding:1px 7px}
.side-foot{padding:14px 16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--dim)}
.side-foot b{color:var(--muted);font-weight:600}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:12px 22px;
  background:rgba(7,7,12,.78);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.crumbs{font-size:13px;color:var(--dim);display:flex;gap:7px;align-items:center;min-width:0;flex-wrap:wrap}
.crumbs b{color:var(--text);font-weight:600}
.search-trigger{margin-left:auto;display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:7px 11px;color:var(--dim);font-size:13.5px;cursor:pointer;min-width:220px}
.search-trigger:hover{border-color:var(--pri-line);color:var(--muted)}
.search-trigger kbd{margin-left:auto;font-family:var(--mono);font-size:10.5px;background:#ffffff0e;border:1px solid var(--line);
  border-radius:5px;padding:1px 5px}
.icon-btn{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:36px;height:36px;display:grid;
  place-items:center;cursor:pointer;color:var(--muted);position:relative;flex:0 0 auto}
.icon-btn:hover{border-color:var(--pri-line);color:var(--text)}
.icon-btn .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--pri2)}
.burger{display:none}
.view{padding:26px 24px 60px;max-width:1360px;width:100%}

/* ---------- typography / bits ---------- */
h2.page-title{font-size:26px;margin:0 0 4px;letter-spacing:-.6px;font-weight:700}
.page-sub{color:var(--muted);margin:0 0 22px;font-size:14px;max-width:70ch}
h3{font-size:16px;margin:0 0 12px;font-weight:600;letter-spacing:-.2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.card{background:linear-gradient(160deg,rgba(255,255,255,.035),rgba(255,255,255,.012));border:1px solid var(--line);
  border-radius:var(--radius);padding:16px}
.card.hoverable{transition:.18s;cursor:pointer}
.card.hoverable:hover{border-color:var(--pri-line);transform:translateY(-2px);box-shadow:var(--shadow)}
.muted{color:var(--muted)}.dim{color:var(--dim)}.small{font-size:12.5px}
.mono{font-family:var(--mono)}
.stat{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1.1}
.stat-label{font-size:11.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--dim);font-weight:600}
.empty{border:1px dashed var(--line);border-radius:var(--radius);padding:34px 20px;text-align:center;color:var(--dim)}
.empty b{display:block;color:var(--muted);font-weight:600;margin-bottom:4px;font-size:14.5px}

.btn{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:10px;padding:8px 14px;font-size:13.5px;font-weight:500;cursor:pointer;transition:.15s;text-decoration:none}
.btn:hover{border-color:var(--pri-line);background:#1b1b28;text-decoration:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:linear-gradient(135deg,var(--pri),#7c3aed);border-color:transparent;color:#fff;font-weight:600}
.btn.pri:hover{filter:brightness(1.12)}
.btn.danger{color:var(--err);border-color:rgba(248,113,113,.3)}
.btn.danger:hover{background:rgba(248,113,113,.12)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.ghost{background:transparent}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.3px;padding:3px 9px;
  border-radius:20px;background:var(--pri-dim);color:#c4b5fd;border:1px solid var(--pri-line);text-transform:uppercase}
.tag.ok{background:rgba(52,211,153,.12);color:#6ee7b7;border-color:rgba(52,211,153,.3)}
.tag.warn{background:rgba(251,191,36,.12);color:#fcd34d;border-color:rgba(251,191,36,.3)}
.tag.err{background:rgba(248,113,113,.12);color:#fca5a5;border-color:rgba(248,113,113,.3)}
.tag.dimt{background:#ffffff08;color:var(--dim);border-color:var(--line)}

label.f{display:block;font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--dim);margin:0 0 6px}
input.i,select.i,textarea.i{width:100%;background:#0c0c14;border:1px solid var(--line);border-radius:10px;padding:9px 12px;
  font-size:14px;outline:none;transition:.15s}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-dim)}
textarea.i{min-height:90px;resize:vertical;font-family:var(--mono);font-size:13px;line-height:1.6}
.field{margin-bottom:14px}
.field-row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
input[type=color].i{padding:3px;height:40px;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--pri)}
.check{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--muted);cursor:pointer;padding:3px 0}
.check input{accent-color:var(--pri);width:16px;height:16px}

.out{background:#0c0c14;border:1px solid var(--line);border-radius:10px;padding:12px;font-family:var(--mono);font-size:12.5px;
  white-space:pre-wrap;word-break:break-word;max-height:340px;overflow:auto;line-height:1.6}
.notice{border:1px solid var(--line);border-left:3px solid var(--pri);background:#ffffff05;border-radius:10px;padding:11px 14px;
  font-size:13px;color:var(--muted)}
.notice.err{border-left-color:var(--err)}
.notice.warn{border-left-color:var(--warn)}
.notice.ok{border-left-color:var(--ok)}

table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);padding:9px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid #ffffff08;vertical-align:middle}
.tbl tr:hover td{background:#ffffff04}
.scroll-x{overflow-x:auto}

/* ---------- modal / toast / palette ---------- */
.overlay{position:fixed;inset:0;background:rgba(4,4,8,.72);backdrop-filter:blur(5px);z-index:100;display:flex;
  align-items:flex-start;justify-content:center;padding:70px 16px 20px;overflow-y:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:100%;max-width:560px;
  box-shadow:var(--shadow);animation:pop .17s ease}
.modal.wide{max-width:860px}
@keyframes pop{from{opacity:0;transform:translateY(-10px) scale(.98)}}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;flex:1}
.modal-b{padding:18px}
.modal-f{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
#toasts{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:9px;max-width:min(360px,92vw)}
.toast{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--pri);border-radius:11px;padding:11px 14px;
  font-size:13.5px;box-shadow:var(--shadow);animation:slide .2s ease}
.toast.ok{border-left-color:var(--ok)}.toast.err{border-left-color:var(--err)}.toast.warn{border-left-color:var(--warn)}
@keyframes slide{from{opacity:0;transform:translateX(24px)}}
.cmd{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:100%;max-width:620px;overflow:hidden;
  box-shadow:var(--shadow);animation:pop .16s ease}
.cmd input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:16px;outline:none}
.cmd-list{max-height:min(56vh,440px);overflow-y:auto;padding:8px}
.cmd-item{display:flex;gap:11px;align-items:center;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:14px}
.cmd-item small{margin-left:auto;color:var(--dim);font-size:11.5px}
.cmd-item.sel,.cmd-item:hover{background:var(--pri-dim)}
.cmd-kind{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);border:1px solid var(--line);
  border-radius:5px;padding:1px 6px}

/* ---------- misc components ---------- */
.tool-grid{display:grid;gap:13px;grid-template-columns:repeat(auto-fill,minmax(258px,1fr))}
.tool-card{display:flex;flex-direction:column;gap:6px;padding:15px;border-radius:13px;border:1px solid var(--line);
  background:linear-gradient(160deg,rgba(255,255,255,.04),rgba(255,255,255,.01));cursor:pointer;transition:.16s;text-align:left}
.tool-card:hover{border-color:var(--pri-line);transform:translateY(-2px)}
.tool-card .ti{width:34px;height:34px;border-radius:9px;background:var(--pri-dim);border:1px solid var(--pri-line);
  display:grid;place-items:center;font-size:17px;margin-bottom:4px}
.tool-card h4{margin:0;font-size:14.5px;font-weight:600}
.tool-card p{margin:0;font-size:12.5px;color:var(--dim);line-height:1.45}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 13px;color:var(--muted);cursor:pointer;
  font-size:13.5px;font-weight:500;white-space:nowrap}
.tabs button.active{color:#fff;border-bottom-color:var(--pri)}
.pill-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:5px 13px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.pill.active{background:var(--pri-dim);border-color:var(--pri-line);color:#ddd6fe}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--dim)}
.kv dd{margin:0}
.bar{height:7px;background:#ffffff0d;border-radius:20px;overflow:hidden}
.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2))}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(140deg,var(--pri),#6d28d9);display:grid;
  place-items:center;font-weight:700;font-size:14px;color:#fff;flex:0 0 auto}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--ok)}
.asset-thumb{width:100%;aspect-ratio:16/10;border-radius:10px;background:#0c0c14 repeating-conic-gradient(#14141d 0% 25%,#0c0c14 0% 50%) 0 0/16px 16px;
  display:grid;place-items:center;overflow:hidden;border:1px solid var(--line)}
.asset-thumb img{width:100%;height:100%;object-fit:contain}
.dropzone{border:2px dashed var(--line);border-radius:14px;padding:30px;text-align:center;color:var(--dim);cursor:pointer;transition:.15s}
.dropzone.drag,.dropzone:hover{border-color:var(--pri);background:var(--pri-dim);color:var(--muted)}

/* skin editor */
.editor-wrap{display:grid;gap:14px;grid-template-columns:230px minmax(0,1fr) 330px;align-items:start}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.toolbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tbtn{background:#0c0c14;border:1px solid var(--line);border-radius:9px;aspect-ratio:1;display:grid;place-items:center;
  cursor:pointer;font-size:15px;color:var(--muted)}
.tbtn.active{background:var(--pri-dim);border-color:var(--pri);color:#fff}
.tbtn:hover{border-color:var(--pri-line)}
#skinCanvasWrap{position:relative;overflow:auto;background:#0a0a11;border:1px solid var(--line);border-radius:12px;
  display:grid;place-items:center;padding:12px;min-height:340px}
#skinCanvas{image-rendering:pixelated;cursor:crosshair;touch-action:none;background:
  repeating-conic-gradient(#1a1a26 0% 25%,#12121b 0% 50%) 0 0/20px 20px}
#skin3d{width:100%;aspect-ratio:3/4;border-radius:12px;background:radial-gradient(circle at 50% 30%,#1b1430,#08080e);
  border:1px solid var(--line);touch-action:none;display:block}
.swatches{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:10px}
.sw{aspect-ratio:1;border-radius:6px;border:1px solid #ffffff18;cursor:pointer}
.sw:hover{transform:scale(1.12)}
.embed-preview{background:#313338;border-radius:8px;padding:12px 14px;color:#dbdee1;font-size:13.5px;
  font-family:"gg sans",var(--sans);max-width:520px}
.embed-preview .eb{border-left:4px solid var(--pri);background:#2b2d31;border-radius:4px;padding:10px 12px}
.embed-preview .et{font-weight:600;color:#fff;margin-bottom:4px}
.embed-preview .ed{white-space:pre-wrap;color:#dbdee1;font-size:13px}
.embed-preview .ef{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:8px}
.embed-preview .efn{font-weight:600;font-size:12.5px;color:#fff}
.mc-preview{background:#101010;border:1px solid var(--line);border-radius:10px;padding:14px;font-family:var(--mono);
  font-size:15px;line-height:1.7;white-space:pre-wrap;word-break:break-word}

@media (max-width:1100px){.editor-wrap{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;width:264px;transform:translateX(-100%);transition:.22s}
  .sidebar.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.8)}
  .burger{display:grid}
  .view{padding:18px 14px 70px}
  .search-trigger{min-width:0;padding:7px 9px}
  .search-trigger span{display:none}
  .topbar{padding:10px 14px}
  #scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:35}
}

/* device lock */
.vs-locked .app{display:none}
#lockScreen{display:none}
.vs-locked #lockScreen{display:flex;position:fixed;inset:0;z-index:500;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(1100px 600px at 82% -8%, rgba(139,92,246,.20), transparent 60%),
             radial-gradient(800px 500px at 0% 100%, rgba(168,85,247,.10), transparent 60%), var(--bg)}
.lock-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:var(--shadow)}

/* auth pages (login / register) — full-screen, no app chrome */
.auth-mode .app{grid-template-columns:1fr}
.auth-mode .sidebar, .auth-mode .topbar{display:none}
.auth-mode .main{min-height:100vh}
.auth-mode .view{padding:0;max-width:none}
.auth-shell{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr;background:var(--bg)}
.auth-side{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:60px 56px;
  background:
    radial-gradient(700px 500px at 20% 15%, rgba(139,92,246,.25), transparent 60%),
    radial-gradient(600px 480px at 85% 85%, rgba(88,28,135,.30), transparent 60%),
    linear-gradient(160deg,#120b22,#07070c 70%)}
.auth-side::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(115deg, transparent 0 70px, rgba(255,255,255,.02) 70px 72px)}
.auth-side img{width:112px;height:112px;object-fit:contain;position:relative;z-index:1;filter:drop-shadow(0 0 40px rgba(139,92,246,.5))}
.auth-side h1{font-size:30px;margin:20px 0 6px;letter-spacing:-.5px;font-weight:800;position:relative;z-index:1}
.auth-side h1 span{color:var(--pri2)}
.auth-side p.tag{color:var(--muted);font-size:15px;margin:0 0 26px;position:relative;z-index:1}
.auth-side ul{list-style:none;margin:0;padding:0;position:relative;z-index:1;display:flex;flex-direction:column;gap:10px}
.auth-side ul li{color:var(--muted);font-size:13.5px;display:flex;gap:9px;align-items:center}
.auth-side ul li::before{content:"✓";color:var(--pri2);font-weight:700}
.auth-main{display:flex;align-items:center;justify-content:center;padding:40px 24px}
.auth-card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:18px;
  padding:36px 34px;box-shadow:var(--shadow)}
.auth-card .brand-sm{display:flex;align-items:center;gap:10px;margin-bottom:26px}
.auth-card .brand-sm img{width:34px;height:34px;object-fit:contain}
.auth-card .brand-sm b{font-size:16px}
.auth-card .brand-sm b span{color:var(--pri2)}
.auth-h{font-size:24px;font-weight:800;margin:0 0 6px;letter-spacing:-.4px}
.auth-h span{color:var(--pri2)}
.auth-sub{color:var(--muted);font-size:13.5px;margin:0 0 22px}
.auth-field{position:relative;margin-bottom:14px}
.auth-field input{width:100%;background:#0c0c14;border:1px solid var(--line);border-radius:11px;padding:12px 14px;
  font-size:14px;outline:none;transition:.15s}
.auth-field input:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-dim)}
.auth-field .peek{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--dim);
  cursor:pointer;font-size:16px;padding:4px}
.auth-row{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;margin:2px 0 18px;flex-wrap:wrap;gap:8px}
.auth-row label{display:flex;align-items:center;gap:7px;color:var(--muted);cursor:pointer}
.auth-row label input{accent-color:var(--pri);width:15px;height:15px}
.auth-row a{color:var(--pri2);font-size:12.5px}
.auth-btn{width:100%;padding:12px;border-radius:11px;border:0;background:linear-gradient(135deg,var(--pri),#4f7bf7);
  color:#fff;font-weight:700;font-size:14.5px;cursor:pointer;transition:.15s}
.auth-btn:hover{filter:brightness(1.1)}
.auth-btn:disabled{opacity:.55;cursor:not-allowed}
.auth-divider{display:flex;align-items:center;gap:12px;color:var(--dim);font-size:12px;margin:18px 0}
.auth-divider::before,.auth-divider::after{content:"";flex:1;height:1px;background:var(--line)}
.auth-discord{width:100%;padding:11px;border-radius:11px;border:1px solid var(--line);background:#5865F214;
  color:#eef0ff;font-weight:600;font-size:13.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px}
.auth-discord:hover{background:#5865F224;border-color:#5865F260}
.auth-switch{text-align:center;font-size:13px;color:var(--muted);margin-top:18px}
.auth-switch a{color:var(--pri2);font-weight:600}
.auth-err{font-size:12.5px;color:var(--err);min-height:16px;margin:-6px 0 12px}
.auth-foot{text-align:center;font-size:11px;color:var(--dim);margin-top:22px;line-height:1.7}
@media (max-width:900px){
  .auth-shell{grid-template-columns:1fr}
  .auth-side{display:none}
  .auth-main{padding:32px 16px}
  .auth-card{padding:28px 22px;border-radius:16px}
  .auth-h{font-size:21px}
}
@media (max-width:420px){
  .auth-main{padding:22px 10px}
  .auth-card{padding:22px 16px}
}

/* home / landing */
.hero-banner{border-radius:20px;padding:44px 40px;position:relative;overflow:hidden;border:1px solid var(--line);
  display:grid;grid-template-columns:1.1fr 0.9fr;gap:20px;align-items:center;
  background:
    radial-gradient(900px 420px at 88% -12%, rgba(139,92,246,.38), transparent 60%),
    radial-gradient(600px 380px at 8% 120%, rgba(168,85,247,.20), transparent 60%),
    linear-gradient(150deg, #180f2e, #0a0a10 65%)}
.hero-banner::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(115deg, transparent 0 66px, rgba(255,255,255,.025) 66px 68px)}
@media (max-width:900px){.hero-banner{grid-template-columns:1fr}.hero-art{display:none}}
.hero-text{position:relative;max-width:640px}
.hero-text h2{font-size:36px;margin:0 0 12px;letter-spacing:-1px;font-weight:800;line-height:1.1}
.hero-text h2 span{color:var(--pri2)}
.hero-text p{color:var(--muted);max-width:56ch;margin:0 0 22px;font-size:15.5px;line-height:1.6}
.home-proj{display:flex;flex-direction:column;min-height:180px}
.hero-badge{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.3px;
  background:#ffffff0d;border:1px solid var(--line);border-radius:20px;padding:5px 13px;color:var(--muted);margin-bottom:18px}
.hero-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.hero-art{position:relative;height:260px;display:flex;align-items:center;justify-content:center}
.hero-vlogo{width:126px;height:126px;border-radius:32px;background:linear-gradient(145deg,var(--pri),#6d28d9);
  display:grid;place-items:center;font-weight:800;font-size:60px;color:#fff;position:relative;z-index:2;
  box-shadow:0 0 70px -8px rgba(168,85,247,.75), 0 20px 50px -10px rgba(0,0,0,.6);transform:rotate(-6deg)}
.hero-block{position:absolute;border-radius:14px;background:linear-gradient(155deg, rgba(139,92,246,.55), rgba(88,28,135,.32));
  border:1px solid rgba(255,255,255,.08);box-shadow:0 14px 32px -12px rgba(0,0,0,.65);z-index:1}
.hero-star{position:absolute;border-radius:50%;background:#fff;z-index:1}
</style>

const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const nowISO = () => new Date().toISOString();
const fmtDate = (iso) => { if (!iso) return "—"; const d = new Date(iso); return isNaN(d) ? "—" : d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }); };
const fmtDT = (iso) => { if (!iso) return "—"; const d = new Date(iso); return isNaN(d) ? "—" : d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }); };
const fmtBytes = (b) => { if (!b && b !== 0) return "—"; const u = ["B", "KB", "MB", "GB"]; let i = 0; while (b >= 1024 && i < 3) { b /= 1024; i++; } return b.toFixed(b < 10 && i ? 1 : 0) + " " + u[i]; };
const ago = (iso) => {
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (isNaN(s)) return "—";
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  if (s < 604800) return Math.floor(s / 86400) + "d ago";
  return fmtDate(iso);
};

/* =========================================================
   DEVICE LOCK — a real password gate for this browser/device.
   Not multi-user cloud auth: there's no server, so there's no
   email verification and no "forgot password" email. The
   password itself is never stored — only a salted PBKDF2-SHA256
   hash, computed locally with the Web Crypto API.
   ========================================================= */
const Lock = {
  key: "vynix:lock", sessionKey: "vynix:unlocked", trustKey: "vynix:trust",
  available() { return !!(window.crypto && crypto.subtle); },
  _bytesToHex(b) { return Array.from(b).map((x) => x.toString(16).padStart(2, "0")).join(""); },
  _hexToBytes(h) { const a = new Uint8Array(h.length / 2); for (let i = 0; i < a.length; i++) a[i] = parseInt(h.substr(i * 2, 2), 16); return a; },
  async _hash(password, saltHex, iterations = 120000) {
    const enc = new TextEncoder();
    const km = await crypto.subtle.importKey("raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: this._hexToBytes(saltHex), iterations, hash: "SHA-256" }, km, 256);
    return this._bytesToHex(new Uint8Array(bits));
  },
  read() { try { const raw = localStorage.getItem(this.key); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } },
  isSet() { return !!this.read(); },
  async create(password, profile) {
    if (!this.available()) throw new Error("This browser doesn't support the Web Crypto API needed for a device password.");
    const salt = this._bytesToHex(crypto.getRandomValues(new Uint8Array(16)));
    const rec = { salt, hash: await this._hash(password, salt), iterations: 120000, profile: profile || {}, createdAt: new Date().toISOString() };
    try { localStorage.setItem(this.key, JSON.stringify(rec)); } catch (e) { throw new Error("Couldn't save the password — this browser is blocking persistent storage."); }
    return rec;
  },
  async verify(password) {
    const rec = this.read(); if (!rec) return false;
    return (await this._hash(password, rec.salt, rec.iterations || 120000)) === rec.hash;
  },
  async changePassword(current, next) {
    if (!(await this.verify(current))) throw new Error("Current password is incorrect.");
    return this.create(next, this.read().profile);
  },
  clear() { try { localStorage.removeItem(this.key); } catch (e) { } this.forget(); },
  unlockSession(remember) {
    try { sessionStorage.setItem(this.sessionKey, "1"); } catch (e) { }
    if (remember) { try { localStorage.setItem(this.trustKey, "1"); } catch (e) { } }
  },
  isUnlocked() {
    try { if (sessionStorage.getItem(this.sessionKey) === "1") return true; } catch (e) { }
    try { if (localStorage.getItem(this.trustKey) === "1") return true; } catch (e) { }
    return false;
  },
  logOut() {
    try { sessionStorage.removeItem(this.sessionKey); } catch (e) { }
    try { localStorage.removeItem(this.trustKey); } catch (e) { }
    DiscordAuth.forgetUser();
  },
  forget() { this.logOut(); }
};

/* ---------------- Discord sign-in (real OAuth2 implicit grant) ----------------
   Needs the studio owner's own Discord application (client ID + a redirect
   URI registered exactly in the Discord Developer Portal). No client secret
   is used or needed — the implicit grant is designed for exactly this: a
   backend-less page. If it isn't configured, the button says so plainly
   instead of pretending to sign anyone in. */
const DiscordAuth = {
  cfgKey: "vynix:discordCfg", userKey: "vynix:discordUser",
  readCfg() { try { return JSON.parse(localStorage.getItem(this.cfgKey) || "null"); } catch (e) { return null; } },
  saveCfg(clientId, redirectUri) { try { localStorage.setItem(this.cfgKey, JSON.stringify({ clientId, redirectUri })); return true; } catch (e) { return false; } },
  clearCfg() { try { localStorage.removeItem(this.cfgKey); } catch (e) { } },
  readUser() { try { return JSON.parse(localStorage.getItem(this.userKey) || "null"); } catch (e) { return null; } },
  forgetUser() { try { localStorage.removeItem(this.userKey); } catch (e) { } },
  authorizeUrl() {
    const cfg = this.readCfg(); if (!cfg || !cfg.clientId || !cfg.redirectUri) return null;
    return "https://discord.com/oauth2/authorize?" + new URLSearchParams({ client_id: cfg.clientId, redirect_uri: cfg.redirectUri, response_type: "token", scope: "identify" }).toString();
  },
  begin() { const url = this.authorizeUrl(); if (!url) return false; location.href = url; return true; },
  async handleCallback() {
    if (!/^#access_token=/.test(location.hash)) return false;
    const params = new URLSearchParams(location.hash.slice(1));
    const token = params.get("access_token");
    history.replaceState(null, "", location.pathname + location.search);
    if (!token) return false;
    try {
      const res = await fetch("https://discord.com/api/users/@me", { headers: { Authorization: "Bearer " + token } });
      if (!res.ok) throw new Error("Discord rejected the request (HTTP " + res.status + ").");
      const me = await res.json();
      const profile = { discordId: me.id, username: me.username, avatar: me.avatar ? `https://cdn.discordapp.com/avatars/${me.id}/${me.avatar}.png` : null };
      try { localStorage.setItem(this.userKey, JSON.stringify(profile)); } catch (e) { }
      Lock.unlockSession(true);
      return true;
    } catch (e) {
      try { sessionStorage.setItem("vynix:discordErr", e.message || "Couldn't reach Discord."); } catch (e2) { }
      return false;
    }
  }
};

/* ---------------- toasts / modals / confirm ---------------- */
function toast(msg, kind = "") {
  const el = document.createElement("div");
  el.className = "toast " + kind;
  el.innerHTML = esc(msg);
  $("#toasts").appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; el.style.transition = ".3s"; setTimeout(() => el.remove(), 320); }, 3600);
}
function closeModal() { $("#modalRoot").innerHTML = ""; }
function modal({ title, body, footer, wide, onMount }) {
  $("#modalRoot").innerHTML = `<div class="overlay" data-close="1"><div class="modal ${wide ? "wide" : ""}">
    <div class="modal-h"><h3>${esc(title)}</h3><button class="icon-btn" data-close="1" style="width:30px;height:30px">✕</button></div>
    <div class="modal-b">${body}</div>${footer ? `<div class="modal-f">${footer}</div>` : ""}</div></div>`;
  $("#modalRoot .overlay").addEventListener("mousedown", (e) => { if (e.target.dataset.close) closeModal(); });
  $$("#modalRoot [data-close]").forEach((b) => b.addEventListener("click", (e) => { if (e.currentTarget.tagName === "BUTTON") closeModal(); }));
  if (onMount) onMount($("#modalRoot .modal"));
}
function confirmDialog(msg, onYes, yesLabel = "Delete") {
  modal({
    title: "Confirm", body: `<p style="margin:0;color:var(--muted)">${esc(msg)}</p>`,
    footer: `<button class="btn" data-close="1">Cancel</button><button class="btn danger" id="cfYes">${esc(yesLabel)}</button>`,
    onMount: (m) => $("#cfYes", m).addEventListener("click", () => { closeModal(); onYes(); })
  });
}
function copyText(t) {
  const done = () => toast("Copied to clipboard", "ok");
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(done, fallback); else fallback();
  function fallback() {
    const ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { toast("Copy failed — select the text manually", "err"); }
    ta.remove();
  }
}

/* ---------------- capability-backed storage ---------------- */
const Store = {
  mode: "local", db: null, assetsCap: null, downloads: null, user: null, canWrite: true, isOwner: false, persistOK: true,
  cols: ["projects", "releases", "tasks", "notes", "assets", "members", "products", "notifications"],
  data: {}, singles: { meta: {}, usage: { tools: {}, days: {} }, activity: { items: [] } },
  _queue: Promise.resolve(),

  async init() {
    this.cols.forEach((c) => (this.data[c] = {}));
    // Standalone build: no sign-in, no owner-login gate, no external
    // capabilities to connect to. This file is fully self-contained —
    // everyone who opens it has full access, and all data lives in
    // this one browser's storage.
    this.isOwner = true; this.canWrite = true; this.mode = "local";
    this.loadLocal();
    await this.seed();
    this.renderBadge();
  },
  renderBadge() {
    const b = $("#storageBadge"); if (!b) return;
    if (!this.persistOK) {
      b.innerHTML = `<span class="status-dot" style="background:var(--err)"></span> Studio storage: this session only`;
      b.title = "Persistent storage is blocked in this browser (private browsing, or local file security settings). Changes work now but won't be saved after this page closes.";
      return;
    }
    b.innerHTML = `<span class="status-dot"></span> Studio storage: this device`;
    b.title = "Data is saved in this browser's local storage and reloads with the page.";
  },
  async loadCloud() {
    const jobs = this.cols.map(async (c) => {
      const snap = await this.db.collection(c).get();
      snap.docs.forEach((d) => { this.data[c][d.id] = Object.assign({ id: d.id }, d.data()); });
    });
    jobs.push(...Object.keys(this.singles).map(async (k) => {
      const s = await this.db.doc("studio/" + k).get();
      if (s.exists) this.singles[k] = Object.assign(this.singles[k], s.data());
    }));
    await Promise.all(jobs);
  },
  loadLocal() {
    this.cols.forEach((c) => { try { this.data[c] = JSON.parse(localStorage.getItem("vynix:" + c) || "{}"); } catch (e) { this.data[c] = {}; } });
    Object.keys(this.singles).forEach((k) => { try { const v = JSON.parse(localStorage.getItem("vynix:s:" + k) || "null"); if (v) this.singles[k] = v; } catch (e) { } });
  },
  saveLocalCol(c) {
    try { localStorage.setItem("vynix:" + c, JSON.stringify(this.data[c])); this.persistOK = true; return true; }
    catch (e) { this.warnNoPersist(); return true; /* keep the change in memory for this session */ }
  },
  saveLocalSingle(k) {
    try { localStorage.setItem("vynix:s:" + k, JSON.stringify(this.singles[k])); }
    catch (e) { this.warnNoPersist(); }
  },
  warnNoPersist() {
    this.persistOK = false;
    this.renderBadge();
    if (this._warnedPersist) return;
    this._warnedPersist = true;
    toast("This browser is blocking persistent storage (private browsing, or file security settings). Everything still works for this session, but won't be saved after you close or reload the page.", "warn");
  },

  list(c, sortKey = "updatedAt") {
    return Object.values(this.data[c] || {}).sort((a, b) => String(b[sortKey] || "").localeCompare(String(a[sortKey] || "")));
  },
  get(c, id) { return (this.data[c] || {})[id] || null; },
  async put(c, obj) {
    if (!obj.id) obj.id = uid();
    if (!obj.createdAt) obj.createdAt = nowISO();
    obj.updatedAt = nowISO();
    this.data[c][obj.id] = obj;
    if (this.mode === "cloud") {
      const body = Object.assign({}, obj); delete body.id;
      try { await this.db.doc(c + "/" + obj.id).set(body); }
      catch (e) { this.handleDbError(e); return false; }
    } else if (!this.saveLocalCol(c)) { delete this.data[c][obj.id]; return false; }
    return true;
  },
  async del(c, id) {
    const prev = this.data[c][id]; delete this.data[c][id];
    if (this.mode === "cloud") { try { await this.db.doc(c + "/" + id).delete(); } catch (e) { this.data[c][id] = prev; this.handleDbError(e); return false; } }
    else this.saveLocalCol(c);
    return true;
  },
  async saveSingle(k) {
    if (this.mode === "cloud") { try { await this.db.doc("studio/" + k).set(JSON.parse(JSON.stringify(this.singles[k]))); } catch (e) { this.handleDbError(e); return false; } }
    else this.saveLocalSingle(k);
    return true;
  },
  handleDbError(e) {
    const code = (e && e.code) || "unavailable";
    if (code === "invalid_argument") toast("This view is read-only, so the change wasn't saved.", "err");
    else if (code === "quota_exceeded") toast("Storage quota is full — delete some documents first.", "err");
    else toast("Storage error (" + code + "). The change wasn't saved.", "err");
    console.warn("db error", e);
  },

  /* activity + notifications + usage */
  async logActivity(text, kind = "general") {
    const items = this.singles.activity.items;
    items.unshift({ id: uid(), text, kind, at: nowISO() });
    this.singles.activity.items = items.slice(0, 60);
    await this.saveSingle("activity");
  },
  async notify(title, body, kind = "studio") {
    await this.put("notifications", { title, body, kind, read: false });
    renderNotifDot();
  },
  async trackTool(toolId) {
    const u = this.singles.usage;
    u.tools[toolId] = (u.tools[toolId] || 0) + 1;
    const day = new Date().toISOString().slice(0, 10);
    u.days[day] = (u.days[day] || 0) + 1;
    clearTimeout(this._usageT);
    this._usageT = setTimeout(() => this.saveSingle("usage"), 900);
  },

  async seed() {
    if (this.singles.meta.seeded) return;
    const projects = [
      { id: "vynix-pvp", name: "Vynix PVP", category: "Modpack", status: "Active", version: "", description: "Lightweight Minecraft PvP-focused modpack.", link: "https://modrinth.com/modpack/vynix-pvp", icon: "⚔️", createdAt: nowISO(), updatedAt: nowISO(), members: [], screenshots: [], changelog: "", docs: "" },

      { id: "vynix-pack", name: "Vynix Pack", category: "Resource Pack", status: "Development", version: "", description: "Minecraft resource-pack project.", link: "", icon: "🎨", createdAt: nowISO(), updatedAt: nowISO(), members: [], screenshots: [], changelog: "", docs: "" }
    ];
    for (const p of projects) if (!this.data.projects[p.id]) { this.data.projects[p.id] = p; if (this.mode === "cloud") { const b = Object.assign({}, p); delete b.id; try { await this.db.doc("projects/" + p.id).set(b); } catch (e) { } } }
    if (this.mode !== "cloud") this.saveLocalCol("projects");
    if (!Object.keys(this.data.members).length) {
      await this.put("members", { id: "owner", name: "NovaGamerz15", role: "Owner", handle: "@novagamerz15", note: "Studio creator" });
    }
    this.singles.meta.seeded = true;
    this.singles.meta.studioName = this.singles.meta.studioName || "Vynix Studio";
    this.singles.meta.myRole = this.singles.meta.myRole || "Owner";
    await this.saveSingle("meta");
  }
};

/* ---------------- router ---------------- */
const ROUTES = {};
function route(name, fn) { ROUTES[name] = fn; }
async function render() {
  const raw = location.hash.replace(/^#\/?/, "");
  const parts = raw.split("/").filter(Boolean);
  const name = parts[0] || "overview";
  const view = $("#view");
  const fn = ROUTES[name];
  window.scrollTo(0, 0);
  document.documentElement.classList.toggle("auth-mode", name === "login" || name === "register");
  // A device password exists but this session hasn't unlocked it — bounce
  // any app route straight to the lock screen instead of quietly rendering
  // studio data underneath it.
  if (Lock.isSet() && !Lock.isUnlocked() && name !== "login" && name !== "register") {
    location.hash = "#/login"; return;
  }
  if (!fn) {
    view.innerHTML = `<h2 class="page-title">Page not found</h2><p class="page-sub">No studio page matches <span class="mono">#/${esc(raw)}</span>.</p><a class="btn pri" href="#/overview">Back to Overview</a>`;
    crumbs([{ t: "Not found" }]);

    try { await fn(view, parts.slice(1)); } catch (e) { console.error(e); view.innerHTML = `<div class="notice err">Something went wrong rendering this page: ${esc(e.message)}</div>`; }
  }
  renderNav();
  $("#sidebar").classList.remove("open");
  const sc = $("#scrim"); if (sc) sc.remove();
}

function pwToggleWire(root, inputId, btnId) {
  const inp = $("#" + inputId, root), btn = $("#" + btnId, root);

function discordButtonHandler(root, remember) {

          name, icon: $("#pIcon", m).value.trim() || "❖", category: $("#pCat", m).value.trim(),
          status: $("#pStatus", m).value, version: $("#pVer", m).value.trim(),
          description: $("#pDesc", m).value.trim(), link
        });

function projectDetail(v, id) {
  const p = Store.get("projects", id);

  crumbs([{ t: "Projects", h: "#/projects" }, { t: p.name }]);

  const assets = Store.list("assets").filter((a) => a.projectId === p.id);
  v.innerHTML = `
    <div class="spread">
      <div class="row" style="gap:14px">

          ${p.link ? `<a href="${esc(p.link)}" target="_blank" rel="noopener">Official page ↗</a>` : ""}</div></div>
      </div>
      <div class="row">

    </div>

      body.innerHTML = `<div class="grid g2">

          <dt>Version</dt><dd class="mono">${esc(p.version || "—")}</dd><dt>Created</dt><dd>${fmtDate(p.createdAt)}</dd>
          <dt>Updated</dt><dd>${fmtDate(p.updatedAt)}</dd><dt>Link</dt><dd>${p.link ? `<a href="${esc(p.link)}" target="_blank" rel="noopener">${esc(p.link)}</a>` : "—"}</dd></dl></div>
        <div class="card"><h3>Counts</h3><dl class="kv"><dt>Releases</dt><dd>${rels.length}</dd><dt>Assets</dt><dd>${assets.length}</dd>
          <dt>Open tasks</dt><dd>${Store.list("tasks").filter((t) => t.projectId === p.id && t.state !== "Done").length}</dd></dl></div>
        ${mrSlug ? `<div class="card" id="mrLiveCard" style="grid-column:1/-1"><div class="spread"><h3>Live Modrinth stats</h3><span class="small dim" id="mrLiveStatus">Loading…</span></div><div id="mrLiveBody" class="grid g4"></div></div>` : ""}
        </div>`;
      if (mrSlug) {
        (async () => {
          try {
            const mp = await mrFetch(`/project/${encodeURIComponent(mrSlug)}`);
            $("#mrLiveStatus", body).textContent = "via Modrinth API — updated just now";
            $("#mrLiveBody", body).innerHTML = `
              <div><div class="stat-label">Downloads</div><div class="stat" style="font-size:22px">${mp.downloads.toLocaleString()}</div></div>
              <div><div class="stat-label">Followers</div><div class="stat" style="font-size:22px">${mp.followers.toLocaleString()}</div></div>
              <div><div class="stat-label">Status</div><div class="stat" style="font-size:22px;text-transform:capitalize">${esc(mp.status)}</div></div>
              <div><div class="stat-label">Last updated</div><div class="stat" style="font-size:16px">${fmtDate(mp.updated)}</div></div>`;
          } catch (e) {
            $("#mrLiveStatus", body).innerHTML = `<span style="color:var(--err)">${esc(e.message)}</span>`;
          }
        })();
      }
    }
    if (tab === "Documentation" || tab === "Changelog") {
      const key = tab === "Documentation" ? "docs" : "changelog";
      body.innerHTML = `<div class="card"><div class="spread"><h3>${tab}</h3>
          <button class="btn sm" id="saveDoc" ${can("projects.write") ? "" : "disabled"}>Save</button></div>
        <textarea class="i" id="docArea" style="min-height:280px" placeholder="Markdown-ish plain text. Saved to studio storage.">${esc(p[key] || "")}</textarea></div>`;
      $("#saveDoc").onclick = async () => {
        if (!guard("projects.write")) return;

      };
    }
    if (tab === "Releases") body.innerHTML = rels.length ? `<div class="card scroll-x">${releaseTable(rels)}</div>` : emptyState("No releases for this project", "Create one from the Releases page.", `<a class="btn pri" href="#/releases">Go to Releases</a>`);
    if (tab === "Assets") body.innerHTML = assets.length ? `<div class="grid g3">${assets.map(assetCard).join("")}</div>` : emptyState("No assets linked to this project", "Upload assets and set their project in the Assets page.", `<a class="btn pri" href="#/assets">Go to Assets</a>`);
    if (tab === "Members") {

      const assigned = p.members || [];
      body.innerHTML = `<div class="card"><h3>Project members</h3>
        ${mem.length ? mem.map((m) => `<label class="check"><input type="checkbox" data-m="${m.id}" ${assigned.includes(m.id) ? "checked" : ""} ${can("projects.write") ? "" : "disabled"}> ${esc(m.name)} <span class="tag dimt">${esc(m.role)}</span></label>`).join("") : emptyState("No studio members yet")}
        ${mem.length ? `<button class="btn pri sm" id="saveMem" style="margin-top:12px" ${can("projects.write") ? "" : "disabled"}>Save members</button>` : ""}</div>`;
      const sm = $("#saveMem"); if (sm) sm.onclick = async () => {
        if (!guard("projects.write")) return;
        p.members = $$("[data-m]").filter((c) => c.checked).map((c) => c.dataset.m);
        if (await Store.put("projects", p)) toast("Members saved", "ok");
      };
    }
  };
  draw("Overview");
  $$("#pTabs button", v).forEach((b) => (b.onclick = () => { $$("#pTabs button", v).forEach((x) => x.classList.remove("active")); b.classList.add("active"); draw(b.dataset.t); }));
  $("#edP").onclick = () => projectModal(p);
  $("#delP").onclick = () => { if (!guard("projects.write")) return; confirmDialog(`Delete project “${p.name}”? Releases and assets linked to it stay, but lose their project link.`, async () => { await Store.del("projects", p.id); await Store.logActivity(`Deleted project “${p.name}”`, "project"); toast("Project deleted", "ok"); location.hash = "#/projects"; }); };

          ${assets.map((a) => `<label class="check"><input type="checkbox" data-ra="${a.id}" ${(r.files || []).includes(a.id) ? "checked" : ""}> ${esc(a.name)} <span class="small dim">${fmtBytes(a.size)}</span></label>`).join("")}</div>`
      : `<div class="small dim">No assets uploaded yet — upload files in the Assets page first.</div>`}</div>
      <label class="check"><input type="checkbox" id="rPub" ${r.published ? "checked" : ""}> Published (unchecked = draft)</label>`,
    footer: `${r.id ? `<button class="btn danger" id="rDel">Delete</button>` : ""}<button class="btn" data-close="1">Cancel</button><button class="btn pri" id="rSave">Save release</button>`,
    onMount: (m) => {
      $("#rSave", m).onclick = async () => {
        const version = $("#rVer", m).value.trim(); if (!version) return toast("Version is required", "err");
        const wasPub = !!r.published;
        const obj = Object.assign({}, r, {
          version, name: $("#rName", m).value.trim(), type: $("#rType", m).value, projectId: $("#rProj", m).value,

        });

          closeModal(); toast("Release saved", "ok"); render();

      };
      const d = $("#rDel", m); if (d) d.onclick = () => confirmDialog("Delete this release?", async () => { await Store.del("releases", r.id); closeModal(); toast("Release deleted", "ok"); render(); });
    }
  });
}

async function uploadFiles(files) {
  if (!guard("assets.write")) return;
  const arr = Array.from(files || []);
  if (!arr.length) return;
  for (const f of arr) {
    try {
      let rec = { name: f.name, size: f.size, type: f.type || "application/octet-stream", folder: "Unsorted" };
      if (Store.assetsCap) {
        const res = await Store.assetsCap.upload(f);
        rec.assetId = res.id; rec.url = res.url; rec.size = res.sizeBytes || f.size; rec.storage = "artifact";
      } else {
        if (f.size > 900 * 1024) { toast(`${f.name} is too large for browser storage (max ~800 KB here).`, "err"); continue; }
        rec.url = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });
        rec.storage = "local";
      }
      if (await Store.put("assets", rec)) { await Store.logActivity(`Uploaded asset “${f.name}”`, "asset"); toast(`Uploaded ${f.name}`, "ok"); }
    } catch (e) { console.warn(e); toast(`Upload failed for ${f.name}: ${(e && e.code) || e.message || "error"}`, "err"); }
  }
  render();
}
async function downloadAsset(a) {
  if (!a || !a.url) return toast("This asset has no stored file", "err");
  try {
    const blob = await (await fetch(a.url)).blob();
    await saveFile(a.name, blob);
  } catch (e) { toast("Download failed: " + (e.message || e.code), "err"); }
}
async function saveFile(filename, data) {
  if (Store.downloads) {
    try { await Store.downloads.save({ filename, data }); toast("Saved " + filename, "ok"); return true; }
    catch (e) {
      const c = (e && e.code) || "";
      if (c === "declined") { toast("Download cancelled", ""); return false; }
      toast("Download failed (" + c + ")", "err"); return false;
    }
  }
  const url = data instanceof Blob ? URL.createObjectURL(data) : URL.createObjectURL(new Blob([data]));
  const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast("Saved " + filename, "ok"); return true;
}
function renameAsset(a) {
  if (!guard("assets.write")) return;
  const projects = Store.list("projects");
  modal({

<script>
/* =========================================================
   TOOLS HUB — every tool below computes its result locally
   ========================================================= */
const TOOLS = [];
const TOOL_TITLES = {};
function tool(t) { TOOLS.push(t); TOOL_TITLES[t.id] = t.title; }
const out = (id) => `<div class="out" id="${id}">—</div>`;
const copyBtn = (id, label = "Copy") => `<button class="btn sm" data-copy="${id}">${label}</button>`;
function wireCopy(root) {
  $$("[data-copy]", root).forEach((b) => (b.onclick = () => { const el = $("#" + b.dataset.copy, root); copyText(el.value !== undefined ? el.value : el.textContent); }));
}

/* ---------- Minecraft colour + formatting ---------- */
const MC_COLORS = { "0": ["black", "#000000"], "1": ["dark_blue", "#0000AA"], "2": ["dark_green", "#00AA00"], "3": ["dark_aqua", "#00AAAA"], "4": ["dark_red", "#AA0000"], "5": ["dark_purple", "#AA00AA"], "6": ["gold", "#FFAA00"], "7": ["gray", "#AAAAAA"], "8": ["dark_gray", "#555555"], "9": ["blue", "#5555FF"], a: ["green", "#55FF55"], b: ["aqua", "#55FFFF"], c: ["red", "#FF5555"], d: ["light_purple", "#FF55FF"], e: ["yellow", "#FFFF55"], f: ["white", "#FFFFFF"] };
const MC_FORMATS = { k: "obfuscated", l: "bold", m: "strikethrough", n: "underline", o: "italic", r: "reset" };
function mcRender(text) {
  let html = "", cur = { color: "#AAAAAA", bold: 0, italic: 0, under: 0, strike: 0 };
  const open = () => `<span style="color:${cur.color};${cur.bold ? "font-weight:700;" : ""}${cur.italic ? "font-style:italic;" : ""}${cur.under || cur.strike ? `text-decoration:${cur.under ? "underline " : ""}${cur.strike ? "line-through" : ""};` : ""}">`;
  let buf = "";
  const flush = () => { if (buf) { html += open() + esc(buf) + "</span>"; buf = ""; } };
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if ((c === "§" || c === "&") && i + 1 < text.length) {
      const code = text[i + 1].toLowerCase();
      if (MC_COLORS[code]) { flush(); cur = { color: MC_COLORS[code][1], bold: 0, italic: 0, under: 0, strike: 0 }; i++; continue; }
      if (MC_FORMATS[code]) {
        flush();
        if (code === "r") cur = { color: "#AAAAAA", bold: 0, italic: 0, under: 0, strike: 0 };
        if (code === "l") cur.bold = 1; if (code === "o") cur.italic = 1; if (code === "n") cur.under = 1; if (code === "m") cur.strike = 1;
        i++; continue;
      }
    }
    buf += c;
  }
  flush();
  return html || '<span class="dim">Preview appears here</span>';
}

        ${Object.entries(MC_FORMATS).map(([k, n]) => `<div class="row small" style="gap:7px"><span class="mono">&amp;${k}</span><span class="dim">${n}</span></div>`).join("")}
        </div></div></div>`;
    const inp = $("#ccIn", el), prev = $("#ccPrev", el);

    $("#toAmp", el).onclick = () => { inp.value = inp.value.replace(/§([0-9a-fk-or])/gi, "&$1"); up(); Store.trackTool("mc.colors"); };
    $("#strip", el).onclick = () => { inp.value = inp.value.replace(/[§&]([0-9a-fk-or])/gi, ""); up(); Store.trackTool("mc.colors"); };

tool({
  id: "mc.time", cat: "Minecraft", icon: "⏱", title: "Time converter", desc: "Ticks ⇄ in-game clock ⇄ real time, with day phases.",
  render(el) {
    el.innerHTML = `<div class="grid g2"><div class="card"><h3>Ticks → clock</h3>
        <div class="field"><label class="f">Ticks (0–23999 in a day)</label><input class="i" type="number" id="tkIn" value="6000"></div>
        <input type="range" id="tkRange" min="0" max="23999" value="6000">
        <div id="tkOut" style="margin-top:12px"></div></div>
      <div class="card"><h3>Clock → ticks</h3>
        <div class="field-row"><div class="field"><label class="f">Hour (0–23)</label><input class="i" type="number" id="hrIn" value="12" min="0" max="23"></div>
        <div class="field"><label class="f">Minute</label><input class="i" type="number" id="mnIn" value="0" min="0" max="59"></div></div>
        <div id="hrOut"></div>
        <h3 style="margin-top:18px">Duration</h3>
        <div class="field"><label class="f">Ticks</label><input class="i" type="number" id="drIn" value="1200"></div>
        <div id="drOut"></div></div></div>`;
    const phase = (t) => t < 12000 ? "Day" : t < 13000 ? "Sunset" : t < 23000 ? "Night" : "Sunrise";
    const upT = () => {
      let t = ((parseInt($("#tkIn", el).value || 0, 10) % 24000) + 24000) % 24000;
      $("#tkRange", el).value = t;
      const total = (t + 6000) % 24000;
      const h = Math.floor(total / 1000), m = Math.floor((total % 1000) * 60 / 1000);
      $("#tkOut", el).innerHTML = `<div class="stat">${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}</div>
        <dl class="kv"><dt>Phase</dt><dd>${phase(t)}</dd><dt>Real time elapsed</dt><dd>${(t / 20).toFixed(1)} s (${(t / 20 / 60).toFixed(2)} min)</dd>
        <dt>Command</dt><dd class="mono">/time set ${t}</dd></dl>`;
      Store.trackTool("mc.time");
    };
    const upH = () => {
      const h = Math.min(23, Math.max(0, parseInt($("#hrIn", el).value || 0, 10)));
      const m = Math.min(59, Math.max(0, parseInt($("#mnIn", el).value || 0, 10)));
      const t = (((h - 6) * 1000 + Math.round(m * 1000 / 60)) % 24000 + 24000) % 24000;
      $("#hrOut", el).innerHTML = `<div class="stat">${t}</div><div class="small dim mono">/time set ${t}</div>`;
    };
    const upD = () => {
      const t = parseInt($("#drIn", el).value || 0, 10);
      const s = t / 20;
      $("#drOut", el).innerHTML = `<dl class="kv"><dt>Seconds</dt><dd>${s.toFixed(2)}</dd><dt>Minutes</dt><dd>${(s / 60).toFixed(3)}</dd>
        <dt>MC days</dt><dd>${(t / 24000).toFixed(3)}</dd></dl>`;
    };
    $("#tkIn", el).oninput = upT; $("#tkRange", el).oninput = (e) => { $("#tkIn", el).value = e.target.value; upT(); };
    $("#hrIn", el).oninput = upH; $("#mnIn", el).oninput = upH; $("#drIn", el).oninput = upD;
    upT(); upH(); upD();
  }
});

tool({

      $("#coOut", el).innerHTML = `<dl class="kv">
        <dt>Overworld</dt><dd class="mono">${ow.x} ${y} ${ow.z}</dd>

tool({
  id: "dc.color", cat: "Discord", icon: "🌈", title: "Colour converter", desc: "Hex ⇄ decimal ⇄ RGB ⇄ HSL for roles, embeds and themes.",
  render(el) {
    el.innerHTML = `<div class="grid g2"><div class="card"><h3>Pick a colour</h3>
      <input type="color" class="i" id="clPick" value="#8b5cf6" style="height:70px">
      <div class="field-row" style="margin-top:12px">
        <div class="field"><label class="f">Hex</label><input class="i mono" id="clHex" value="#8b5cf6"></div>
        <div class="field"><label class="f">Decimal</label><input class="i mono" id="clDec"></div></div>
      <div class="field"><label class="f">RGB</label><input class="i mono" id="clRgb"></div></div>
      <div class="card"><h3>Details</h3><div id="clOut"></div>
        <div style="height:80px;border-radius:12px;margin-top:14px" id="clSwatch"></div></div></div>`;
    const set = (hex) => {
      hex = hex.replace(/[^0-9a-f]/gi, "").slice(0, 6).padEnd(6, "0");
      const r = parseInt(hex.slice(0, 2), 16), g = parseInt(hex.slice(2, 4), 16), b = parseInt(hex.slice(4, 6), 16);
      const dec = (r << 16) + (g << 8) + b;
      $("#clHex", el).value = "#" + hex; $("#clDec", el).value = dec; $("#clRgb", el).value = `${r}, ${g}, ${b}`; $("#clPick", el).value = "#" + hex;
      const rr = r / 255, gg = g / 255, bb = b / 255, mx = Math.max(rr, gg, bb), mn = Math.min(rr, gg, bb);
      let h = 0, s = 0; const l = (mx + mn) / 2;
      if (mx !== mn) { const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn); h = mx === rr ? (gg - bb) / d + (gg < bb ? 6 : 0) : mx === gg ? (bb - rr) / d + 2 : (rr - gg) / d + 4; h *= 60; }
      const lum = 0.2126 * rr + 0.7152 * gg + 0.0722 * bb;
      $("#clOut", el).innerHTML = `<dl class="kv"><dt>Hex</dt><dd class="mono">#${hex.toUpperCase()}</dd><dt>Decimal (embed colour)</dt><dd class="mono">${dec}</dd>
        <dt>RGB</dt><dd class="mono">rgb(${r}, ${g}, ${b})</dd><dt>HSL</dt><dd class="mono">hsl(${h.toFixed(0)}, ${(s * 100).toFixed(0)}%, ${(l * 100).toFixed(0)}%)</dd>
        <dt>Relative luminance</dt><dd>${lum.toFixed(3)} — best with ${lum > .45 ? "dark" : "light"} text</dd></dl>`;
      $("#clSwatch", el).style.background = "#" + hex;
      Store.trackTool("dc.color");
    };
    $("#clPick", el).oninput = (e) => set(e.target.value);
    $("#clHex", el).oninput = (e) => set(e.target.value);
    $("#clDec", el).oninput = (e) => { const n = parseInt(e.target.value, 10); if (!isNaN(n)) set((n & 0xffffff).toString(16).padStart(6, "0")); };
    $("#clRgb", el).oninput = (e) => { const p = e.target.value.split(/[ ,]+/).map(Number); if (p.length >= 3 && p.every((x) => !isNaN(x))) set(p.slice(0, 3).map((x) => Math.min(255, Math.max(0, x | 0)).toString(16).padStart(2, "0")).join("")); };
    set("8b5cf6");
  }
});

/* ---------- Modrinth API — real, CORS-open, no key required ----------
   Modrinth's public API sends Access-Control-Allow-Origin: * on every
   response, so unlike Mojang/Discord it can be called directly from a
   browser with no backend proxy. Docs: https://docs.modrinth.com/api/ */
const MODRINTH_API = "https://api.modrinth.com/v2";
async function mrFetch(path) {
  let res;
  try { res = await fetch(MODRINTH_API + path); }
  catch (e) { throw new Error("Couldn't reach the Modrinth API. Check your internet connection."); }
  if (!res.ok) {
    if (res.status === 404) throw new Error("Not found on Modrinth.");
    if (res.status === 429) throw new Error("Modrinth's rate limit was hit (300 requests/min) — wait a moment and try again.");
    throw new Error(`Modrinth API returned an error (HTTP ${res.status}).`);
  }
  return res.json();
}
function mrSlugFromUrl(url) {
  const m = /modrinth\.com\/(?:mod|modpack|resourcepack|shader|plugin|datapack)\/([^/?#]+)/i.exec(url || "");
  return m ? m[1] : null;
}

        </div>
      </div>
      <div id="skinCanvasWrap"><canvas id="skinCanvas" width="64" height="64"></canvas></div>
      <p class="small dim" style="margin-top:10px">Left-drag to paint. Standard 64×64 skins are supported, and legacy 64×32 skins are converted on import.</p>
    </div>

    <div class="pane">
      <div class="spread" style="margin-bottom:10px"><h3 style="margin:0">3D preview</h3>
        <select class="i" id="skModel" style="max-width:130px"><option value="classic">Classic (4px)</option><option value="slim">Slim (3px)</option></select></div>
      <div id="skin3dHost"><canvas id="skin3d"></canvas></div>

  let part = "Head", partOverlay = false, clip = null;
  const undoStack = [], redoStack = [];

  const regionOf = () => (partOverlay ? SKIN_OVERLAY[part].region : SKIN_PARTS[part].region);
  function pushUndo() { undoStack.push(tctx.getImageData(0, 0, 64, 64)); if (undoStack.length > 40) undoStack.shift(); redoStack.length = 0; }
  function paintDisplay() {
    disp.width = 64 * zoom; disp.height = 64 * zoom;

      }

    const [rx, ry, rw, rh] = regionOf();
    c.strokeStyle = "#a855f7"; c.lineWidth = 2;
    c.strokeRect(rx * zoom, ry * zoom, rw * zoom, rh * zoom);
    if (texture) texture.needsUpdate = true;
  }
  function setPixel(x, y, col) {
    if (x < 0 || y < 0 || x > 63 || y > 63) return;
    if (lockPart) { const [rx, ry, rw, rh] = regionOf(); if (x < rx || y < ry || x >= rx + rw || y >= ry + rh) return; }
    if (col === null) { tctx.clearRect(x, y, 1, 1); return; }

  function floodFill(sx, sy, col) {
    const img = tctx.getImageData(0, 0, 64, 64), d = img.data;
    const idx = (x, y) => (y * 64 + x) * 4;
    const target = [d[idx(sx, sy)], d[idx(sx, sy) + 1], d[idx(sx, sy) + 2], d[idx(sx, sy) + 3]];

      if (x < lim[0] || y < lim[1] || x >= lim[0] + lim[2] || y >= lim[1] + lim[3]) continue;
      const i = idx(x, y);
      if (d[i] !== target[0] || d[i + 1] !== target[1] || d[i + 2] !== target[2] || d[i + 3] !== target[3]) continue;
      d[i] = rgb[0]; d[i + 1] = rgb[1]; d[i + 2] = rgb[2]; d[i + 3] = rgb[3];
      stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
    }
    tctx.putImageData(img, 0, 0);
  }
  function defaultSkin() {
    tctx.clearRect(0, 0, 64, 64);

    const fills = [["#2b2b3d", SKIN_PARTS.Body.region], ["#e0ac69", SKIN_PARTS.Head.region],
    ["#e0ac69", SKIN_PARTS["Right Arm"].region], ["#e0ac69", SKIN_PARTS["Left Arm"].region],

    if (tool === "pencil") setPixel(x, y, color);

    else if (tool === "picker") { const c = pixelAt(x, y); if (c) { color = c; $("#skColor", root).value = c; } }

  });

  $$("[data-sw]", root).forEach((s) => (s.onclick = () => {

  $("#skImport", root).onclick = () => $("#skFile", root).click();
  $("#skFile", root).onchange = (e) => {
    const f = e.target.files[0]; if (!f) return;

          tctx.save(); tctx.translate(dx + w, dy); tctx.scale(-1, 1); tctx.drawImage(tmp, 0, 0); tctx.restore();

  };
  $("#skExport", root).onclick = () => tex.toBlob((b) => saveFile("vynix-skin.png", b), "image/png");
  $("#skSaveAsset", root).onclick = () => {
    if (!guard("assets.write")) return;
    tex.toBlob(async (b) => {
      const file = new File([b], "vynix-skin-" + Date.now() + ".png", { type: "image/png" });
      await uploadFiles([file]);
    }, "image/png");
  };

  /* ----- 3D preview ----- */
  let texture = null, group = null, overlayGroup = null, renderer = null, scene = null, camera = null, spin = false;
  let rotY = 0.5, rotX = 0;
  function uvFace(geo, faceIdx, x, y, w, h) {
    const uv = geo.attributes.uv;
    const u0 = x / 64, u1 = (x + w) / 64, v0 = 1 - (y + h) / 64, v1 = 1 - y / 64;
    const i = faceIdx * 4;
    uv.setXY(i, u0, v1); uv.setXY(i + 1, u1, v1); uv.setXY(i + 2, u0, v0); uv.setXY(i + 3, u1, v0);
    uv.needsUpdate = true;
  }
  function makeBox(w, h, d, uvMap, sizeMap, grow) {
    const g = new THREE.BoxGeometry(w + grow, h + grow, d + grow);
    // face order: +X, -X, +Y, -Y, +Z, -Z  →  left, right, top, bottom, front, back
    const order = [["l", "l"], ["r", "r"], ["t", "t"], ["b", "b"], ["f", "f"], ["k", "k"]];
    order.forEach(([k], i) => uvFace(g, i, uvMap[k][0], uvMap[k][1], sizeMap[k][0], sizeMap[k][1]));
    return g;
  }
  function buildModel(slim) {
    if (group) { scene.remove(group); scene.remove(overlayGroup); }
    group = new THREE.Group(); overlayGroup = new THREE.Group();
    Object.entries(SKIN_PARTS).forEach(([name, p]) => {
      let uvm = JSON.parse(JSON.stringify(p.uv)), szm = JSON.parse(JSON.stringify(p.size)), box = p.box.slice(), pos = p.pos.slice();
      if (slim && p.arm) {
        box[0] = 3;
        if (p.arm === "right") { uvm = { r: [40, 20], l: [47, 20], t: [44, 16], b: [47, 16], f: [44, 20], k: [51, 20] }; pos[0] = -5.5; }
        else { uvm = { r: [32, 52], l: [39, 52], t: [36, 48], b: [39, 48], f: [36, 52], k: [43, 52] }; pos[0] = 5.5; }
        szm = { r: [4, 12], l: [4, 12], t: [3, 4], b: [3, 4], f: [3, 12], k: [3, 12] };
      }
      const mat = new THREE.MeshLambertMaterial({ map: texture, transparent: false });
      const mesh = new THREE.Mesh(makeBox(box[0], box[1], box[2], uvm, szm, 0), mat);
      mesh.position.set(pos[0], pos[1], pos[2]);
      group.add(mesh);
      const ov = SKIN_OVERLAY[name];
      let ouv = JSON.parse(JSON.stringify(ov.uv)), osz = JSON.parse(JSON.stringify(szm));
      if (slim && p.arm) {
        ouv = p.arm === "right" ? { r: [40, 36], l: [47, 36], t: [44, 32], b: [47, 32], f: [44, 36], k: [51, 36] }
          : { r: [48, 52], l: [55, 52], t: [52, 48], b: [55, 48], f: [52, 52], k: [59, 52] };
      }
      const omat = new THREE.MeshLambertMaterial({ map: texture, transparent: true, alphaTest: 0.2, side: THREE.DoubleSide, depthWrite: false });
      const omesh = new THREE.Mesh(makeBox(box[0], box[1], box[2], ouv, osz, name === "Head" ? 1 : 0.6), omat);
      omesh.position.set(pos[0], pos[1], pos[2]);
      overlayGroup.add(omesh);
    });
    group.position.y = -16; overlayGroup.position.y = -16;
    const pivot = new THREE.Group();
    scene.add(group); scene.add(overlayGroup);
    overlayGroup.visible = showOverlay;
  }
  function init3d() {
    const canvas = $("#skin3d", root);
    if (typeof THREE === "undefined") {
      $("#sk3dFallback", root).innerHTML = `<div class="notice err" style="margin-top:10px">The 3D library didn't load in this view, so the preview is unavailable. The pixel editor, import and PNG export all still work.</div>`;
      canvas.style.display = "none"; return;
    }
    try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true }); }
    catch (e) {
      $("#sk3dFallback", root).innerHTML = `<div class="notice err" style="margin-top:10px">WebGL isn't available in this browser, so the 3D preview is off. Everything else still works.</div>`;
      canvas.style.display = "none"; return;
    }
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(38, 1, 0.1, 500);
    camera.position.set(0, 2, 62);
    scene.add(new THREE.AmbientLight(0xffffff, 0.85));
    const d1 = new THREE.DirectionalLight(0xffffff, 0.55); d1.position.set(1, 1, 2); scene.add(d1);
    const d2 = new THREE.DirectionalLight(0xc4b5fd, 0.35); d2.position.set(-1, .5, -2); scene.add(d2);
    texture = new THREE.CanvasTexture(tex);
    texture.magFilter = THREE.NearestFilter; texture.minFilter = THREE.NearestFilter;
    buildModel(false);
    const resize = () => {
      const w = canvas.clientWidth || 300, h = canvas.clientHeight || 400;
      renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
    };
    resize(); window.addEventListener("resize", resize);
    let dragging = false, lx = 0, ly = 0;
    canvas.addEventListener("pointerdown", (e) => { dragging = true; lx = e.clientX; ly = e.clientY; canvas.setPointerCapture(e.pointerId); });
    canvas.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      rotY += (e.clientX - lx) * 0.01; rotX = Math.max(-1.2, Math.min(1.2, rotX + (e.clientY - ly) * 0.008));
      lx = e.clientX; ly = e.clientY;
    });
    ["pointerup", "pointercancel"].forEach((ev) => canvas.addEventListener(ev, () => (dragging = false)));
    const loop = () => {
      if (!document.body.contains(canvas)) { renderer.dispose(); window.removeEventListener("resize", resize); return; }
      if (spin) rotY += 0.01;
      [group, overlayGroup].forEach((g) => { if (g) { g.rotation.y = rotY; g.rotation.x = rotX; } });
      renderer.render(scene, camera);
      requestAnimationFrame(loop);
    };
    loop();
  }
  $("#skModel", root).onchange = (e) => { if (scene) buildModel(e.target.value === "slim"); };
  $("#skSpin", root).onclick = (e) => { spin = !spin; e.target.classList.toggle("active"); e.target.textContent = spin ? "Stop rotate" : "Auto-rotate"; };
  $("#skFront", root).onclick = () => { rotY = 0; rotX = 0; };
  $("#skBack", root).onclick = () => { rotY = Math.PI; rotX = 0; };
  $("#skReset", root).onclick = () => { rotY = 0.5; rotX = 0; };

  defaultSkin(); paintDisplay(); init3d(); paintDisplay();
  Store.trackTool("editor.skin");

  document.onkeydown = (e) => {
    if (!document.body.contains(disp)) { document.onkeydown = null; return; }
    if (e.target.matches("input,textarea,select")) return;
    const map = { b: "pencil", e: "eraser", i: "picker", g: "fill" };
    if (map[e.key.toLowerCase()]) { tool = map[e.key.toLowerCase()]; $$("[data-tool]", root).forEach((x) => x.classList.toggle("active", x.dataset.tool === tool)); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); $("#skUndo", root).click(); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "y") { e.preventDefault(); $("#skRedo", root).click(); }
  };
}

function imageEditor(root) {
  root.innerHTML = `<div class="grid" style="grid-template-columns:minmax(0,360px) minmax(0,1fr)">
    <div class="pane">
      <h3>Source</h3>
      <div class="dropzone" id="imDrop"><b>Choose an image</b><div class="small">PNG, JPG, WEBP, GIF (first frame)</div>

      <div id="imInfo" class="small dim" style="margin-top:10px">No image loaded.</div>
      <h3 style="margin-top:18px">Resize</h3>
      <div class="field-row"><div class="field"><label class="f">Width</label><input class="i" type="number" id="imW"></div>
        <div class="field"><label class="f">Height</label><input class="i" type="number" id="imH"></div></div>

      <h3 style="margin-top:18px">Crop</h3>
      <div class="field-row"><div class="field"><label class="f">X</label><input class="i" type="number" id="imX" value="0"></div>
        <div class="field"><label class="f">Y</label><input class="i" type="number" id="imY" value="0"></div></div>
      <div class="field-row"><div class="field"><label class="f">Crop W</label><input class="i" type="number" id="imCW"></div>
        <div class="field"><label class="f">Crop H</label><input class="i" type="number" id="imCH"></div></div>
      <h3 style="margin-top:18px">Output</h3>
      <div class="field-row"><div class="field"><label class="f">Format</label><select class="i" id="imFmt"><option value="image/png">PNG</option><option value="image/jpeg">JPEG</option><option value="image/webp">WEBP</option></select></div>
        <div class="field"><label class="f">Quality <span id="imQV" class="dim">0.9</span></label><input type="range" id="imQ" min="0.1" max="1" step="0.05" value="0.9"></div></div>
      <div class="row"><button class="btn pri" id="imApply">Process</button><button class="btn" id="imDl" disabled>Download</button>
        <button class="btn" id="imSave" disabled>Save to Assets</button></div>
    </div>
    <div class="pane"><h3>Result</h3>
      <div class="asset-thumb" style="aspect-ratio:auto;min-height:320px"><canvas id="imOut" style="max-width:100%;max-height:60vh"></canvas></div>
      <div id="imStats" class="small dim" style="margin-top:10px">Load an image and press Process.</div></div></div>`;
  let img = null, blob = null;
  const load = (f) => {
    const i = new Image();
    i.onload = () => {
      img = i;
      $("#imW", root).value = i.naturalWidth; $("#imH", root).value = i.naturalHeight;
      $("#imCW", root).value = i.naturalWidth; $("#imCH", root).value = i.naturalHeight;
      $("#imInfo", root).textContent = `${f.name} — ${i.naturalWidth}×${i.naturalHeight}, ${fmtBytes(f.size)}`;
      process();
    };
    i.onerror = () => toast("That file couldn't be read as an image", "err");
    i.src = URL.createObjectURL(f);
  };
  $("#imDrop", root).onclick = () => $("#imFile", root).click();
  $("#imDrop", root).ondragover = (e) => { e.preventDefault(); $("#imDrop", root).classList.add("drag"); };
  $("#imDrop", root).ondragleave = () => $("#imDrop", root).classList.remove("drag");
  $("#imDrop", root).ondrop = (e) => { e.preventDefault(); $("#imDrop", root).classList.remove("drag"); if (e.dataTransfer.files[0]) load(e.dataTransfer.files[0]); };
  $("#imFile", root).onchange = (e) => e.target.files[0] && load(e.target.files[0]);
  $("#imW", root).oninput = () => { if ($("#imRatio", root).checked && img) $("#imH", root).value = Math.max(1, Math.round(+$("#imW", root).value * img.naturalHeight / img.naturalWidth)); };

  $("#imQ", root).oninput = (e) => ($("#imQV", root).textContent = e.target.value);
  function process() {
    if (!img) return toast("Load an image first", "err");
    const cx = Math.max(0, +$("#imX", root).value || 0), cy = Math.max(0, +$("#imY", root).value || 0);
    const cw = Math.min(img.naturalWidth - cx, +$("#imCW", root).value || img.naturalWidth);
    const ch = Math.min(img.naturalHeight - cy, +$("#imCH", root).value || img.naturalHeight);
    const w = Math.max(1, +$("#imW", root).value || cw), h = Math.max(1, +$("#imH", root).value || ch);

    c.toBlob((b) => {
      blob = b;
      $("#imStats", root).textContent = `${w}×${h} · ${fmt.split("/")[1].toUpperCase()} · ${fmtBytes(b.size)}`;
      $("#imDl", root).disabled = false; $("#imSave", root).disabled = false;
    }, fmt, q);
    Store.trackTool("editor.image");
  }
  $("#imApply", root).onclick = process;
  $("#imDl", root).onclick = () => blob && saveFile("vynix-image." + ($("#imFmt", root).value.split("/")[1].replace("jpeg", "jpg")), blob);
  $("#imSave", root).onclick = () => { if (!blob || !guard("assets.write")) return; const ext = $("#imFmt", root).value.split("/")[1].replace("jpeg", "jpg"); uploadFiles([new File([blob], "vynix-image-" + Date.now() + "." + ext, { type: blob.type })]); };
}

/* =========================================================
   ICON & BANNER CREATOR
   ========================================================= */
const ICON_PRESETS = [["Resource pack icon", 128, 128], ["Discord server icon", 512, 512], ["Discord banner", 960, 540],
["Project banner", 1280, 480], ["Wallpaper 1080p", 1920, 1080], ["Wallpaper 4K", 3840, 2160]];
function iconEditor(root) {
  root.innerHTML = `<div class="grid" style="grid-template-columns:minmax(0,340px) minmax(0,1fr)">
    <div class="pane"><h3>Canvas</h3>
      <div class="field"><label class="f">Preset</label><select class="i" id="icPreset">${ICON_PRESETS.map(([n, w, h], i) => `<option value="${i}">${n} — ${w}×${h}</option>`).join("")}</select></div>
      <div class="field-row"><div class="field"><label class="f">Width</label><input class="i" type="number" id="icW" value="128"></div>
        <div class="field"><label class="f">Height</label><input class="i" type="number" id="icH" value="128"></div></div>
      <h3>Background</h3>
      <div class="field-row"><div class="field"><label class="f">Colour A</label><input class="i" type="color" id="icC1" value="#8b5cf6"></div>
        <div class="field"><label class="f">Colour B</label><input class="i" type="color" id="icC2" value="#0b0b13"></div></div>
      <div class="field"><label class="f">Style</label><select class="i" id="icStyle"><option>Diagonal gradient</option><option>Radial glow</option><option>Solid</option><option>Grid</option></select></div>
      <h3>Text</h3>
      <div class="field"><label class="f">Main text</label><input class="i" id="icT1" value="V"></div>
      <div class="field"><label class="f">Sub text</label><input class="i" id="icT2" value="VYNIX STUDIO"></div>
      <div class="field-row"><div class="field"><label class="f">Text colour</label><input class="i" type="color" id="icTC" value="#ffffff"></div>
        <div class="field"><label class="f">Main size %</label><input class="i" type="number" id="icTS" value="52"></div></div>
      <label class="check"><input type="checkbox" id="icRound"> Rounded corners</label>
      <div class="row" style="margin-top:12px"><button class="btn pri" id="icDraw">Render</button>
        <button class="btn" id="icDl">Download PNG</button><button class="btn" id="icSave">Save to Assets</button></div></div>
    <div class="pane"><h3>Preview</h3>
      <div class="asset-thumb" style="aspect-ratio:auto;min-height:300px;padding:10px"><canvas id="icOut" style="max-width:100%;max-height:60vh"></canvas></div>
      <div class="small dim" style="margin-top:10px" id="icInfo"></div></div></div>`;
  const draw = () => {
    const w = Math.max(16, Math.min(4096, +$("#icW", root).value || 128));
    const h = Math.max(16, Math.min(4096, +$("#icH", root).value || 128));
    const c = $("#icOut", root); c.width = w; c.height = h;
    const x = c.getContext("2d");
    const c1 = $("#icC1", root).value, c2 = $("#icC2", root).value, style = $("#icStyle", root).value;
    x.clearRect(0, 0, w, h);
    if ($("#icRound", root).checked) { const r = Math.min(w, h) * .18; x.beginPath(); x.moveTo(r, 0); x.arcTo(w, 0, w, h, r); x.arcTo(w, h, 0, h, r); x.arcTo(0, h, 0, 0, r); x.arcTo(0, 0, w, 0, r); x.closePath(); x.clip(); }
    if (style === "Solid") { x.fillStyle = c1; x.fillRect(0, 0, w, h); }
    else if (style === "Radial glow") { const g = x.createRadialGradient(w / 2, h * .38, 0, w / 2, h / 2, Math.max(w, h) * .75); g.addColorStop(0, c1); g.addColorStop(1, c2); x.fillStyle = g; x.fillRect(0, 0, w, h); }
    else { const g = x.createLinearGradient(0, 0, w, h); g.addColorStop(0, c1); g.addColorStop(1, c2); x.fillStyle = g; x.fillRect(0, 0, w, h); }
    if (style === "Grid") {
      x.strokeStyle = "rgba(255,255,255,.12)"; x.lineWidth = Math.max(1, w / 400);
      const step = Math.max(12, w / 16);
      for (let i = 0; i < w; i += step) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, h); x.stroke(); }
