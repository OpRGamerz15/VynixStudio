    if (t2) { x.font = `600 ${Math.round(h * .085)}px Outfit, system-ui, sans-serif`; x.letterSpacing = `${Math.round(h * .01)}px`; x.fillText(t2, w / 2, h * .75); }
    $("#icInfo", root).textContent = `${w}×${h} canvas — download produces a real PNG at full resolution.`;
    Store.trackTool("editor.icon");
  };
  $("#icPreset", root).onchange = (e) => { const [, w, h] = ICON_PRESETS[+e.target.value]; $("#icW", root).value = w; $("#icH", root).value = h; draw(); };
  $$("input,select", root).forEach((i) => { i.oninput = draw; i.onchange = i.onchange || draw; });
  $("#icDraw", root).onclick = draw;
  $("#icDl", root).onclick = () => $("#icOut", root).toBlob((b) => saveFile("vynix-icon.png", b), "image/png");
  $("#icSave", root).onclick = () => { if (!guard("assets.write")) return; $("#icOut", root).toBlob((b) => uploadFiles([new File([b], "vynix-icon-" + Date.now() + ".png", { type: "image/png" })]), "image/png"); };
  draw();
}

/* ---------------- Studio route (landing) ---------------- */
route("studio", (v) => { location.hash = "#/overview"; });
</script>
<script>
/* =========================================================
   COMMAND PALETTE / GLOBAL SEARCH
   ========================================================= */
function searchIndex() {
  const items = [];
  NAV.filter((n) => n.r).forEach((n) => items.push({ kind: "Page", label: n.t, hash: "#/" + n.r }));
  TOOLS.forEach((t) => items.push({ kind: "Tool", label: t.title, sub: t.cat, hash: "#/tools/" + t.id }));
  EDITORS.forEach((e) => items.push({ kind: "Editor", label: e.title, hash: "#/editors/" + e.id }));
  Store.list("projects").forEach((p) => items.push({ kind: "Project", label: p.name, sub: p.status, hash: "#/projects/" + p.id }));
  Store.list("releases").forEach((r) => items.push({ kind: "Release", label: (r.name || "") + " " + r.version, sub: r.type, hash: "#/releases" }));
  Store.list("assets").forEach((a) => items.push({ kind: "Asset", label: a.name, sub: a.folder, hash: "#/assets" }));
  Store.list("members").forEach((m) => items.push({ kind: "Member", label: m.name, sub: m.role, hash: "#/team" }));
  Store.list("products").forEach((p) => items.push({ kind: "Product", label: p.name, sub: p.price || "Free", hash: "#/shop" }));
  Store.list("tasks").forEach((t) => items.push({ kind: "Task", label: t.title, sub: t.state, hash: "#/workspace" }));
  Store.list("notes").forEach((n) => items.push({ kind: "Note", label: n.title, hash: "#/workspace" }));
  items.push({ kind: "Action", label: "New project", run: () => projectModal() });
  items.push({ kind: "Action", label: "New task", run: () => taskModal() });
  items.push({ kind: "Action", label: "New release", run: () => releaseModal() });
  items.push({ kind: "Action", label: "Upload asset", hash: "#/assets" });
  return items;
}
let cmdSel = 0, cmdItems = [];
function openPalette() {
  const all = searchIndex();
  $("#modalRoot").innerHTML = `<div class="overlay" data-close="1" style="padding-top:12vh"><div class="cmd">
    <input id="cmdIn" placeholder="Search projects, tools, assets, people… or type a command" autocomplete="off">
    <div class="cmd-list" id="cmdList"></div></div></div>`;
  const inp = $("#cmdIn"), list = $("#cmdList");
  const draw = () => {
    const q = inp.value.trim().toLowerCase();
    cmdItems = (q ? all.filter((i) => (i.label + " " + (i.sub || "") + " " + i.kind).toLowerCase().includes(q)) : all).slice(0, 40);
    cmdSel = 0;
    list.innerHTML = cmdItems.length ? cmdItems.map((i, n) => `<div class="cmd-item ${n === 0 ? "sel" : ""}" data-i="${n}">
        <span class="cmd-kind">${esc(i.kind)}</span><span>${esc(i.label)}</span>${i.sub ? `<small>${esc(i.sub)}</small>` : ""}</div>`).join("")
      : `<div class="cmd-item dim">No matches in this studio.</div>`;
    $$("[data-i]", list).forEach((el) => (el.onclick = () => go(+el.dataset.i)));
  };
  const go = (n) => {
    const it = cmdItems[n]; if (!it) return;
    closeModal();
    if (it.run) it.run(); else if (it.hash) location.hash = it.hash;
  };
  inp.oninput = draw;
  inp.onkeydown = (e) => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      cmdSel = Math.max(0, Math.min(cmdItems.length - 1, cmdSel + (e.key === "ArrowDown" ? 1 : -1)));
      $$(".cmd-item", list).forEach((el, i) => el.classList.toggle("sel", i === cmdSel));
      const sel = $$(".cmd-item", list)[cmdSel]; if (sel) sel.scrollIntoView({ block: "nearest" });
    }
    if (e.key === "Enter") { e.preventDefault(); go(cmdSel); }
    if (e.key === "Escape") closeModal();
  };
  $("#modalRoot .overlay").addEventListener("mousedown", (e) => { if (e.target.dataset.close) closeModal(); });
  draw(); inp.focus();
}

/* ---------------- global shortcuts ---------------- */
let gPressed = false;
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openPalette(); return; }
  if (e.key === "Escape") { closeModal(); return; }
  if (e.target.matches("input,textarea,select")) return;
  if (e.key.toLowerCase() === "g") { gPressed = true; setTimeout(() => (gPressed = false), 900); return; }
  if (gPressed) {
    const map = { p: "projects", t: "tools", e: "editors", w: "workspace", r: "releases", a: "assets", o: "overview", s: "shop", n: "notifications" };
    if (map[e.key.toLowerCase()]) { location.hash = "#/" + map[e.key.toLowerCase()]; gPressed = false; }
  }
});

/* ---------------- boot ---------------- */
(async function boot() {
  $("#searchBtn").onclick = openPalette;
  $("#notifBtn").onclick = () => (location.hash = "#/notifications");
  $("#burger").onclick = () => {
    const sb = $("#sidebar"); sb.classList.toggle("open");
    if (sb.classList.contains("open")) {
      const sc = document.createElement("div"); sc.id = "scrim";
      sc.onclick = () => { sb.classList.remove("open"); sc.remove(); };
      document.body.appendChild(sc);
    } else { const sc = $("#scrim"); if (sc) sc.remove(); }
  };
  renderNav();
  // Catch a Discord OAuth redirect back to this page before anything else,
  // since it arrives as #access_token=... which isn't one of our routes.
  await DiscordAuth.handleCallback();
  $("#view").innerHTML = `<div class="empty"><b>Opening Vynix Studio…</b><div class="small">Connecting to studio storage.</div></div>`;
  await Store.init();
  renderNotifDot();
  document.documentElement.classList.remove("vs-locked");
  const ls = document.getElementById("lockScreen"); if (ls) ls.remove();
  if (!location.hash || /^#access_token=/.test(location.hash)) {
    location.hash = Lock.isSet() && !Lock.isUnlocked() ? "#/login" : "#/home";
  }
  await render();
})();

</script>
